name: QA Excel R31.94

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/qa-excel-r3194.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/r31-94-excel-repair
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install QA dependencies
        run: npm install --no-save exceljs@4.4.0 xlsx@0.18.5 jszip@3.10.1
      - name: Run Excel export QA
        run: node qa_excel_r3194_test.mjs
